<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альберт Штоль — автор метода биомеханической коррекции PRIMORDIS</title>
    <meta name="description" content="Опыт, философия и квалификация Альберта Штоля. Более 20 лет практической деятельности в области оптимизации человеческой инфраструктуры и настройки соосности C0-C1.">
    <style>
        :root {
            --bg-color: #0d0e11;
            --text-color: #e4e4e7;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --card-bg: #18191e;
            --border-color: #27272a;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #ffffff;
            text-decoration: none;
        }
        nav a {
            color: #a1a1aa;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
        }
        main {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 1.5rem;
        }
        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }
        
        .author-hero {
            display: flex;
            gap: 2.5rem;
            align-items: center;
            margin: 3rem 0;
        }
        .author-photo-wrapper {
            flex: 0 0 300px;
            max-width: 300px;
        }
        .author-photo {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: block;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .author-bio-intro {
            flex: 1;
        }
        
        h2 {
            color: #ffffff;
            font-size: 1.7rem;
            margin-top: 3rem;
            margin-bottom: 1rem;
        }
        .profile-box {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-color);
            padding: 2rem;
            border-radius: 0 8px 8px 0;
            margin: 2.5rem 0;
        }
        .fact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin: 2.5rem 0;
        }
        .fact-card {
            background: #111319;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 6px;
        }
        .fact-card strong {
            color: #ffffff;
            font-size: 1.4rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .cta-block {
            background: #111319;
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
            text-align: center;
            margin: 3.5rem 0;
        }
        .btn-cta {
            display: inline-block;
            background: var(--accent-color);
            color: #ffffff;
            padding: 1rem 2.5rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: background 0.3s;
            margin-top: 1.5rem;
        }
        .btn-cta:hover {
            background: var(--accent-hover);
        }

        @media (max-width: 640px) {
            .author-hero {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }
            .author-photo-wrapper {
                margin: 0 auto;
                max-width: 260px;
            }
        }
    </style>
</head>
